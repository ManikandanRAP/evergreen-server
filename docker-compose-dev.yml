version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: evergreen-redis-dev
    restart: unless-stopped
    networks:
      - evergreen_dev_net
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]

  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evergreen-server-backend-dev
    ports:
      - "8001:8000"  # Dev uses port 8001
    env_file:
      - .env.dev
    environment:
      - DB_HOST=${DB_HOST:-evergreen-mysql-dev}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-rootpassword}
      - DB_NAME=${DB_NAME:-evergreen_dev}
      - DB_PORT=${DB_PORT:-3306}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_me}
      - ENVIRONMENT=development
      - DEBUG=true
      - MYSQL_CONTAINER_NAME=${MYSQL_CONTAINER_NAME:-evergreen-mysql-dev}
      - REDIS_URL=redis://redis:6379/0
      - LEDGER_CACHE_TTL_SECONDS=86400
    depends_on:
      - redis
    networks:
      - evergreen_dev_net
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  evergreen_dev_net:
    external: true


