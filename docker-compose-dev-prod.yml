version: '3.8'
services:
  backend:
    build: .
    container_name: evergreen-server-backend-dev
    ports:
      - "8001:8000"  # Map host 8001 to container 8000
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=evergreen
      - DB_PORT=3306
      - SECRET_KEY=a56355d68f0a1b04226cfae1768177aec80bf730faec8092b87af36d79791524
      - MYSQL_CONTAINER_NAME=evergreen-mysql
    networks:
      - evergreen_net
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  evergreen_net:
    driver: bridge
    external: true  # Use existing network if it exists, or remove this line

