version: '3.8'
services:
  redis:
    image: redis:7-alpine
    container_name: evergreen-redis
    restart: unless-stopped
    networks:
      - evergreen_net
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
  db:
    image: mysql:8.0
    container_name: evergreen-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=evergreen
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
    ports:
      - "3306:3306"  # External access on port 3307
    volumes:
      - ../db_data:/var/lib/mysql
    networks:
      - evergreen_net
    restart: unless-stopped
    command: --bind-address=0.0.0.0 --default-authentication-plugin=mysql_native_password
  backend:
    build: .
    container_name: evergreen-server-backend
    ports:
      - "8001:8000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=evergreen
      - DB_PORT=3306
      - SECRET_KEY= a56355d68f0a1b04226cfae1768177aec80bf730faec8092b87af36d79791524
      - MYSQL_CONTAINER_NAME=evergreen-mysql
      - REDIS_URL=redis://redis:6379/0
      - LEDGER_CACHE_TTL_SECONDS=86400
    depends_on:
      - db
      - redis
    networks:
      - evergreen_net
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Add these for debugging
    stdin_open: true
    tty: true

networks:
  evergreen_net:
    driver: bridge


